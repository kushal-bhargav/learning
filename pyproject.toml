[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gmgi"
version = "0.1.0"
description = "Gift Intelligence: negotiated agency in multi-agent human-AI gift co-creation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "datasets",
    "fastapi",
    "jsonschema",
    "lpips",
    "matplotlib",
    "networkx",
    "numpy",
    "open-clip-torch",
    "pillow",
    "pydantic>=2",
    "scipy",
    "sentence-transformers",
    "torch",
    "torch-fidelity",
    "torchmetrics[image]",
    "tqdm",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


